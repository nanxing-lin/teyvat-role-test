<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提瓦特角色测试 · 你会是哪位角色</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-border" aria-hidden="true"></div>

  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path d="M24 3 43 12v12c0 13-8 19-19 21C13 43 5 37 5 24V12Z" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="M24 12 34 18v6c0 7-4 10-10 11-6-1-10-4-10-11v-6Z" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <path d="M24 18v8m0 0-4 3m4-3 4 3" fill="none" stroke="currentColor" stroke-width="1.2"/>
          </svg>
        </span>
        <span class="brand-name">提瓦特角色测试</span>
      </div>
      <div class="fan-note">粉丝趣味解读 · 非官方</div>
    </header>

    <main id="app">
      <section id="intro" class="screen intro-screen" aria-labelledby="introTitle">
        <div class="intro-kicker">TEYVAT AFFINITY TEST</div>
        <h1 id="introTitle">你会是提瓦特<br>里的哪位角色</h1>
        <p class="intro-sub">用 20 个选择，测出你与 24 位角色的共鸣，看看谁最像你。</p>
        <div class="intro-line" aria-hidden="true"></div>
        <div class="intro-meta">
          <span>20 道题</span>
          <span>约 4-5 分钟</span>
          <span>24 位角色档案</span>
        </div>
        <button id="startBtn" class="primary-btn" type="button">开始共鸣测试</button>
        <p class="disclaimer">本测试为粉丝趣味解读，不代表米哈游官方结论</p>
      </section>

      <section id="quiz" class="screen quiz-screen is-hidden" aria-labelledby="quizTitle">
        <div class="quiz-head">
          <div class="progress-label"><span id="progressIndex">01</span><span class="progress-total">/ 20</span></div>
          <div class="progress-rail"><span id="progressFill"></span></div>
        </div>
        <div class="question-panel">
          <p id="quizDomain" class="domain-label">自由观</p>
          <h2 id="quizTitle" class="question-title"></h2>
          <div id="optionsList" class="option-list"></div>
          <div class="quiz-actions">
            <button id="prevBtn" class="text-btn" type="button">上一题</button>
            <span id="hintText" class="hint-text">选择一个答案后继续</span>
            <button id="nextBtn" class="primary-btn next-btn" type="button" disabled>下一题</button>
          </div>
        </div>
      </section>

      <section id="result" class="screen result-screen is-hidden" aria-labelledby="resultTitle"></section>
    </main>

    <footer class="app-footer">
      仅供娱乐参考 · 不收集个人数据
    </footer>
  </div>

  <div id="toast" class="toast is-hidden" role="status"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
